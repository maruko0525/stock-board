<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOCK BOARD 株価取得テスト2</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f7f8;margin:0;color:#111}.w{max-width:620px;margin:auto;padding:24px}.c{background:#fff;border-radius:24px;padding:24px;margin:16px 0}.p{font-size:52px;font-weight:800}.ch{font-size:26px;font-weight:700}.up{color:#e21}.dn{color:#1670e8}.muted{color:#777}button{width:100%;padding:17px;border:0;border-radius:16px;background:#111;color:#fff;font-size:18px;font-weight:700}.s{padding:14px;background:#e9eef0;border-radius:14px;white-space:pre-wrap;line-height:1.6}
</style></head><body><div class="w"><h1>📊 株価取得テスト2</h1><div class="c"><b>三菱重工業 7011.T</b><div id="p" class="p">---</div><div id="c" class="ch">---</div><div id="t" class="muted"></div></div>
<button onclick="go()">🔄 取得テスト開始</button><div id="s" class="s">3経路を各3秒で順番にテストします。</div></div>
<script>
const y='https://query1.finance.yahoo.com/v8/finance/chart/7011.T?interval=1d&range=5d';
const routes=[
 ['Yahoo直接',y],
 ['AllOrigins','https://api.allorigins.win/raw?url='+encodeURIComponent(y)],
 ['CORSProxy','https://corsproxy.io/?url='+encodeURIComponent(y)]
];
async function timedFetch(url,ms=3000){
 const ctl=new AbortController(),id=setTimeout(()=>ctl.abort(),ms);
 try{return await fetch(url,{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(id)}
}
async function go(){
 let log=[],st=document.getElementById('s');
 for(const [name,url] of routes){
  log.push('▶ '+name+' を試行中…');st.textContent=log.join('\n');
  try{
   const r=await timedFetch(url);if(!r.ok)throw Error('HTTP '+r.status);
   const d=await r.json(),m=d.chart.result[0].meta;
   const price=Number(m.regularMarketPrice),prev=Number(m.chartPreviousClose??m.previousClose);
   if(!isFinite(price)||!isFinite(prev))throw Error('価格データなし');
   const diff=price-prev,pct=diff/prev*100,sign=diff>=0?'+':'';
   document.getElementById('p').textContent=price.toLocaleString('ja-JP',{maximumFractionDigits:2});
   const ce=document.getElementById('c');ce.textContent=sign+diff.toLocaleString('ja-JP',{maximumFractionDigits:2})+'  '+sign+pct.toFixed(2)+'%';ce.className='ch '+(diff>=0?'up':'dn');
   document.getElementById('t').textContent='取得 '+new Date().toLocaleString('ja-JP');
   log[log.length-1]='✅ '+name+' 成功';st.textContent=log.join('\n');return;
  }catch(e){log[log.length-1]='❌ '+name+' '+(e.name==='AbortError'?'3秒でタイムアウト':e.message);st.textContent=log.join('\n')}
 }
 log.push('取得できませんでした。次は専用中継API方式が必要です。');st.textContent=log.join('\n');
}
</script></body></html>
