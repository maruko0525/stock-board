<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yahoo埋め込みテスト</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7}
body{display:flex;flex-direction:column}
header{padding:10px 14px;background:#fff;border-bottom:1px solid #ddd;font-weight:800}
#frameWrap{flex:1;min-height:0}
iframe{width:100%;height:100%;border:0;background:#fff}
nav{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
button{border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800;background:#e9e9ee}
button:last-child{background:#111;color:#fff}
#status{text-align:center;font-size:13px;font-weight:700;white-space:nowrap}
small{display:block;color:#777;font-weight:500;margin-top:2px}
</style>
</head>
<body>
<header>🧪 Yahoo!埋め込みテスト <small>表示されれば巡回バー方式が使えます</small></header>
<div id="frameWrap"><iframe id="yf" title="Yahoo Finance"></iframe></div>
<nav>
<button onclick="move(-1)">◀ 前へ</button>
<div id="status"></div>
<button onclick="move(1)">次へ ▶</button>
</nav>
<script>
const pages=[
 {name:"三菱重工｜掲示板",url:"https://finance.yahoo.co.jp/quote/7011.T/forum"},
 {name:"日経平均｜チャート",url:"https://finance.yahoo.co.jp/quote/998407.O/chart"},
 {name:"オルカン｜チャート",url:"https://finance.yahoo.co.jp/quote/0331418A/chart"}
];
let i=0;
function show(){
 document.getElementById("yf").src=pages[i].url;
 document.getElementById("status").innerHTML=(i+1)+" / "+pages.length+"<small>"+pages[i].name+"</small>";
}
function move(n){i=(i+n+pages.length)%pages.length;show()}
show();
</script>
</body>
</html>
