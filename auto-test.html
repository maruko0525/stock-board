<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STOCK BOARD 自動巡回テスト</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6f7;color:#111}
main{max-width:680px;margin:auto;padding:22px 16px 40px}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0}
h1{font-size:25px;margin:0 0 6px}.sub{color:#666;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;border:0;border-radius:14px;padding:14px 16px;font-weight:800}
select{background:#eee} button{background:#111;color:#fff;flex:1}
.stop{background:#e9e9ee;color:#111}
#state{font-size:22px;font-weight:900;margin:12px 0}
.item{padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.note{font-size:13px;color:#666;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>⏱ 自動巡回テスト</h1>
<div class="sub">Yahoo用の1タブを使い回せるかiPhone Safariで確認します。</div>

<div class="card">
  <div class="row">
    <label><b>表示時間</b></label>
    <select id="seconds"></select>
  </div>
  <div id="state">待機中</div>
  <div class="row">
    <button onclick="startTour()">▶ 巡回開始</button>
    <button class="stop" onclick="stopTour()">■ 停止</button>
  </div>
  <p class="note">テストでは「三菱重工 掲示板 → 日経平均 チャート → オルカン チャート」を順番に表示します。まず5秒で試してください。</p>
</div>

<div class="card">
 <div class="item">1　三菱重工｜掲示板</div>
 <div class="item">2　日経平均｜チャート</div>
 <div class="item">3　オルカン｜チャート</div>
</div>
</main>

<script>
const pages=[
 {name:"三菱重工｜掲示板",url:"https://finance.yahoo.co.jp/quote/7011.T/forum"},
 {name:"日経平均｜チャート",url:"https://finance.yahoo.co.jp/quote/998407.O/chart"},
 {name:"オルカン｜チャート",url:"https://finance.yahoo.co.jp/quote/0331418A/chart"}
];
const sel=document.getElementById('seconds');
for(let s=2;s<=60;s++){let o=document.createElement('option');o.value=s;o.textContent=s+'秒';if(s===5)o.selected=true;sel.appendChild(o)}
let w=null,timer=null,i=0,running=false;

function startTour(){
 stopTour(false);
 i=0; running=true;
 // Must be opened directly from the user's tap to avoid popup blocking.
 w=window.open(pages[0].url,'stockBoardYahoo');
 if(!w){document.getElementById('state').textContent='ポップアップがブロックされました';running=false;return}
 document.getElementById('state').textContent='1 / 3　'+pages[0].name;
 schedule();
}
function schedule(){
 if(!running)return;
 const ms=Number(sel.value)*1000;
 timer=setTimeout(()=>{
   if(!running)return;
   i=(i+1)%pages.length;
   try{
     if(!w || w.closed){ stopTour(false); document.getElementById('state').textContent='Yahoo画面を閉じたため終了'; return; }
     w.location.href=pages[i].url;
     document.getElementById('state').textContent=(i+1)+' / '+pages.length+'　'+pages[i].name;
   }catch(e){
     document.getElementById('state').textContent='Safariの制限で自動切替できませんでした';
     running=false; clearTimeout(timer); return;
   }
   schedule();
 },ms);
}
function stopTour(update=true){
 running=false;
 if(timer)clearTimeout(timer);
 timer=null;
 if(update)document.getElementById('state').textContent='停止しました';
}
window.addEventListener('pageshow',e=>{
 // If user navigates back to this page, stop any pending tour.
 if(e.persisted) stopTour();
});
</script>
</body>
</html>
