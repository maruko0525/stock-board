<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff"><title>Stock Board</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}.top{display:flex;align-items:center;gap:10px}.top h1{font-size:18px;margin:0;flex:1}.btn{border:0;border-radius:10px;padding:9px 12px;background:#111;color:#fff;font-weight:700}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:18px;padding:8px 12px;font-size:13px}.tab.active{background:#111;color:#fff;border-color:#111}.card{margin:12px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 5px #0001}.name{font-weight:800;font-size:20px}.code{color:#777;font-size:13px;margin-top:3px}.actions{display:flex;gap:8px;margin-top:12px}.open{flex:1;text-align:center;text-decoration:none;background:#5b4df7;color:#fff;padding:13px;border-radius:12px;font-weight:800}.small{border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px}.hint{font-size:13px;color:#666;line-height:1.55;margin-top:12px}.empty{text-align:center;padding:60px 25px;color:#777}dialog{border:0;border-radius:18px;width:min(92vw,430px);padding:18px}dialog::backdrop{background:#0008}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:5px 0 12px;font-size:16px}.row{display:flex;gap:8px}.row>*{flex:1}.ghost{background:#eee;color:#111}.manage{margin-top:14px;border-top:1px solid #eee;padding-top:10px}.manageItem{display:flex;align-items:center;gap:7px;padding:7px 0}.manageItem span{flex:1}.mini{border:0;border-radius:8px;padding:7px 9px}.danger{background:#fee;color:#b00}.move{background:#eee}.footer{text-align:center;color:#999;font-size:11px;padding:15px 10px 30px}
</style></head><body>
<header><div class="top"><h1>📈 STOCK BOARD</h1><button class="btn" id="addBtn">＋ 銘柄</button></div><div class="tabs" id="tabs"></div></header>
<main id="main"></main>
<dialog id="dlg"><h3 style="margin-top:0">銘柄を追加</h3><label>銘柄コード</label><input id="code" inputmode="numeric" placeholder="例：7011"><label>表示名</label><input id="stockName" placeholder="例：三菱重工"><div class="row"><button class="btn ghost" id="cancel">閉じる</button><button class="btn" id="save">追加</button></div><div class="manage"><b>登録銘柄の並べ替え・削除</b><div id="manage"></div></div></dialog>
<script>
const KEY='stockBoardV1';
let stocks=JSON.parse(localStorage.getItem(KEY)||'null')||[
 {code:'7011',name:'三菱重工'},{code:'5803',name:'フジクラ'},{code:'8306',name:'三菱UFJ'},{code:'6857',name:'アドバンテスト'},{code:'9984',name:'ソフトバンクG'}];
let current=0; const tabs=document.querySelector('#tabs'), main=document.querySelector('#main'), dlg=document.querySelector('#dlg');
function saveData(){localStorage.setItem(KEY,JSON.stringify(stocks))}
function forum(s){return `https://finance.yahoo.co.jp/quote/${encodeURIComponent(s.code)}.T/forum`}
function render(){tabs.innerHTML='';stocks.forEach((s,i)=>{let b=document.createElement('button');b.className='tab'+(i===current?' active':'');b.textContent=`${s.code} ${s.name}`;b.onclick=()=>{current=i;render()};tabs.appendChild(b)}); if(!stocks.length){main.innerHTML='<div class="empty">「＋ 銘柄」から監視銘柄を追加してください。</div>';return} current=Math.min(current,stocks.length-1);let s=stocks[current];main.innerHTML=`<div class="card"><div class="name">${esc(s.name)}</div><div class="code">${esc(s.code)} ・ Yahoo!ファイナンス掲示板</div><div class="actions"><a class="open" href="${forum(s)}" target="_blank" rel="noopener">掲示板を開く ↗</a><button class="small" onclick="nextStock(-1)">←</button><button class="small" onclick="nextStock(1)">→</button></div><div class="hint">上のタブで銘柄を即切替。← →でも次の銘柄へ移動できます。掲示板はYahoo!ファイナンスを直接開くため、ログインや投稿などYahoo!側の機能もそのまま使えます。</div></div><div class="footer">登録銘柄はこの端末に保存されます</div>`;setTimeout(()=>tabs.children[current]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),0)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.nextStock=d=>{if(!stocks.length)return;current=(current+d+stocks.length)%stocks.length;render()}
function manage(){let box=document.querySelector('#manage');box.innerHTML='';stocks.forEach((s,i)=>{let d=document.createElement('div');d.className='manageItem';d.innerHTML=`<span>${esc(s.code)} ${esc(s.name)}</span><button class="mini move">↑</button><button class="mini move">↓</button><button class="mini danger">削除</button>`;let bs=d.querySelectorAll('button');bs[0].onclick=()=>move(i,-1);bs[1].onclick=()=>move(i,1);bs[2].onclick=()=>{stocks.splice(i,1);current=0;saveData();manage();render()};box.appendChild(d)})}
function move(i,d){let j=i+d;if(j<0||j>=stocks.length)return;[stocks[i],stocks[j]]=[stocks[j],stocks[i]];saveData();manage();render()}
document.querySelector('#addBtn').onclick=()=>{manage();dlg.showModal()};document.querySelector('#cancel').onclick=()=>dlg.close();document.querySelector('#save').onclick=()=>{let code=document.querySelector('#code').value.trim().replace(/\.T$/i,''),name=document.querySelector('#stockName').value.trim();if(!/^\d{4}$/.test(code)){alert('4桁の銘柄コードを入力してください');return}if(!name)name=code;if(stocks.some(s=>s.code===code)){alert('すでに登録されています');return}stocks.push({code,name});saveData();current=stocks.length-1;document.querySelector('#code').value='';document.querySelector('#stockName').value='';dlg.close();render()};
let x0=null;document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(x0==null)return;let dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70)nextStock(dx<0?1:-1);x0=null},{passive:true});render();
</script></body></html>
